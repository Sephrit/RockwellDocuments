name: Update Documentation Index

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.pdf'
      - 'tools/update_index.py'
      - 'tools/update_catalog.py'
      - '.github/workflows/update-index.yml'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (no LFS download needed — scripts read pointer sizes)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Regenerate README and catalog
        run: |
          python3 tools/update_index.py
          python3 tools/update_catalog.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update index [skip ci]" && git push)
