name: Verify PDFs

# Manual-only: this job needs a full LFS checkout (5+ GB), which consumes
# LFS bandwidth quota every run. Trigger from the Actions tab when you want
# a full integrity audit; day-to-day verification happens locally
# (tools/download_backlog.py checks %PDF magic on every download).
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Verify all PDFs
        run: python3 tools/verify_pdfs.py
