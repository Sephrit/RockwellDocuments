name: Verify PDFs

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.pdf'
      - 'verify_pdfs.py'
      - 'requirements.txt'
      - '.github/workflows/verify-pdfs.yml'
  pull_request:
    paths:
      - '**/*.pdf'
      - 'verify_pdfs.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify all PDFs
        run: python verify_pdfs.py
